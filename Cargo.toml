[workspace]
resolver = "2"
members = [
    "crates/nautilus-core",
    "crates/nautilus-dialect",
    "crates/nautilus-connector",
    "crates/nautilus-schema",
    "crates/nautilus-codegen",
    "crates/nautilus-events-macros",
    "crates/nautilus-migrate",
    "crates/nautilus-protocol",
    "crates/nautilus-engine",
    "crates/nautilus-cli",
    "crates/nautilus-lsp",
]

[workspace.package]
version = "1.3.5"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["nautilus-env"]
repository = "https://github.com/nautilus-env/nautilus"
homepage = "https://github.com/nautilus-env/nautilus"
keywords = ["orm", "database", "sql", "query-builder"]
categories = ["database"]

[workspace.dependencies]
nautilus-core      = { path = "crates/nautilus-core",      package = "nautilus-orm-core",      version = "1.3.5" }
nautilus-dialect   = { path = "crates/nautilus-dialect",   package = "nautilus-orm-dialect",   version = "1.3.5" }
nautilus-connector = { path = "crates/nautilus-connector", package = "nautilus-orm-connector", version = "1.3.5" }
nautilus-protocol  = { path = "crates/nautilus-protocol",  package = "nautilus-orm-protocol",  version = "1.3.5" }
nautilus-schema    = { path = "crates/nautilus-schema",    package = "nautilus-orm-schema",    version = "1.3.5" }
nautilus-codegen   = { path = "crates/nautilus-codegen",   package = "nautilus-orm-codegen",   version = "1.3.5" }
nautilus-migrate   = { path = "crates/nautilus-migrate",   package = "nautilus-orm-migrate",   version = "1.3.5" }
nautilus-engine    = { path = "crates/nautilus-engine",    package = "nautilus-orm-engine",    version = "1.3.5" }
nautilus-lsp       = { path = "crates/nautilus-lsp",       package = "nautilus-orm-lsp",       version = "1.3.5" }

# Shared external dependencies. Feature baseline lives here; crates add their
# extra features additively via `features = [...]` next to `workspace = true`.
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16.3"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rust_decimal = "1.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.2", features = ["postgres", "sqlite", "mysql"] }
thiserror = "2.0.18"
tokio = "1.42"
uuid = "1.0"

# Shared dev-dependencies
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

# The profile that 'dist' will build with.
# NOTE: do not add `panic = "abort"` — the engine transport converts handler
# panics into JSON-RPC errors via `catch_unwind` (see engine/src/transport.rs);
# aborting would kill the process instead of answering the client.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
