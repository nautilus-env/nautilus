[package]
name = "nautilus-orm-engine"
description = "Query execution engine for Nautilus ORM"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.wix]
upgrade-guid = "2D973E64-3999-4EB0-965F-BF7A63AAAFDB"
path-guid = "C99D95B1-331E-4EF9-A994-E259DA0EB813"
license = false
eula = false

[lib]
name = "nautilus_engine"

[[bin]]
name = "nautilus-engine"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-std", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sonic-rs = "0.5.8"

nautilus-protocol = { workspace = true }
nautilus-connector = { workspace = true }
nautilus-schema = { workspace = true }
nautilus-core = { workspace = true }
nautilus-dialect = { workspace = true }
nautilus-migrate = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, default-features = true, features = ["serde"] }
rust_decimal = { workspace = true }
futures = { workspace = true }
console = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "rows_json"
harness = false

[[bench]]
name = "hydrate_includes"
harness = false
