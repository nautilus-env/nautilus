[package]
name = "nautilus-orm-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Database executors and connection management for Nautilus ORM"

[lib]
name = "nautilus_connector"

[dependencies]
nautilus-core = { workspace = true }
nautilus-dialect = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "uuid", "chrono", "rust_decimal"] }
futures = { workspace = true }
async-stream = "0.3"
tokio = { workspace = true, features = ["sync", "time", "rt"] }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
rustc-hash = "2"
smallvec = "1"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
criterion = { workspace = true }

[[bench]]
name = "row_access"
harness = false

[[bench]]
name = "decode_rows"
harness = false

[lints]
workspace = true
