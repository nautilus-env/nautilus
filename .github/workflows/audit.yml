name: Audit

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  # Advisories land without the dependency tree changing, so re-check weekly.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rsa is required by SQLx 0.8's MySQL driver and has no patched
          # release. SQLx 0.9 makes it optional, but requires Rust 1.94 and is
          # therefore above this workspace's 1.92 MSRV.
          # rkyv 0.7 is an inactive optional dependency of rust_decimal. The
          # unsupported 0.7 series has no patch; the separately locked 0.8
          # series is kept on a fixed release.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0235
