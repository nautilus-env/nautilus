name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Test (unit + no-DB)
        run: cargo test --locked --workspace --exclude nautilus-orm-connector --exclude nautilus-orm-codegen

      # `nautilus-orm-codegen` is excluded above because `stream_runtime_e2e_tests`
      # shells out to Python, Node and the JDK. Every other test file in the crate
      # is pure Rust and belongs in the fast job.
      - name: Test codegen (no external toolchains)
        env:
          INSTA_UPDATE: 'no'
        run: |
          cargo test --locked -p nautilus-orm-codegen \
            --lib --bins \
            --test snapshot_tests \
            --test type_helpers_tests \
            --test writer_tests \
            --test parse_schema_tests \
            --test readme_contract_tests

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check
        run: cargo check --locked --workspace --all-targets

  cross-platform:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Test codegen portability
        env:
          INSTA_UPDATE: 'no'
        run: cargo test --locked -p nautilus-orm-codegen --test snapshot_tests --test writer_tests

  codegen-e2e:
    name: Codegen runtime end-to-end
    runs-on: ubuntu-latest
    needs: ci
    env:
      NAUTILUS_REQUIRE_E2E: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve Java release from the code generator
        id: java-release
        run: |
          version="$(grep -oP '^const JAVA_RELEASE: &str = "\K[^"]+' \
            crates/nautilus-codegen/src/java/bundle.rs)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-release.outputs.version }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-codegen-

      - name: Install Python runtime dependencies
        run: python -m pip install --upgrade pip pydantic

      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      # The tests fall back to an `--offline` build of this binary, which cannot
      # fetch the CLI-only dependencies; build it online first.
      - name: Build the nautilus binary
        run: cargo build --locked -p nautilus-orm --bin nautilus

      # Fetch the version declared by the tests; missing jars fail this job.
      - name: Fetch Jackson jars for the Java client tests
        run: |
          version="$(grep -oP 'JAVA_JACKSON_VERSION: &str = "\K[^"]+' \
            crates/nautilus-codegen/tests/stream_runtime_e2e_tests.rs)"
          test -n "$version"
          dir="target/test-jars/jackson-${version}"
          mkdir -p "$dir"
          base=https://repo1.maven.org/maven2/com/fasterxml/jackson
          for artifact in jackson-annotations jackson-core jackson-databind; do
            curl -fsSL -o "${dir}/${artifact}-${version}.jar" \
              "${base}/core/${artifact}/${version}/${artifact}-${version}.jar"
          done
          curl -fsSL -o "${dir}/jackson-datatype-jsr310-${version}.jar" \
            "${base}/datatype/jackson-datatype-jsr310/${version}/jackson-datatype-jsr310-${version}.jar"

      - name: Run codegen runtime end-to-end tests
        run: cargo test --locked -p nautilus-orm-codegen --test stream_runtime_e2e_tests -- --nocapture

  postgres-extensions:
    name: Migration tests (PostgreSQL extensions)
    runs-on: ubuntu-latest
    needs: ci
    env:
      NAUTILUS_REQUIRE_E2E: '1'
      NAUTILUS_TEST_POSTGRES_URL: postgres://nautilus:nautilus@localhost:5432/nautilus_extensions_test

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: nautilus
          POSTGRES_PASSWORD: nautilus
          POSTGRES_DB: nautilus_extensions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nautilus -d nautilus_extensions_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-extensions-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-extensions-

      # These tests create and drop database-wide extensions as well as schemas.
      - name: Run PostgreSQL extension migration tests
        run: cargo test --locked -p nautilus-orm-migrate --test postgres_extensions_e2e -- --ignored --test-threads=1 --nocapture

      - name: Run PostgreSQL vector connector test
        env:
          DATABASE_URL: ${{ env.NAUTILUS_TEST_POSTGRES_URL }}
        run: cargo test --locked -p nautilus-orm-connector --test integration_pg test_vector_column_round_trips_through_the_binary_protocol -- --exact --ignored --nocapture

  integration:
    name: Integration tests (Postgres + MySQL + SQLite)
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nautilus
          POSTGRES_PASSWORD: nautilus
          POSTGRES_DB: nautilus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nautilus -d nautilus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nautilus_root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: nautilus_test
          MYSQL_USER: nautilus
          MYSQL_PASSWORD: nautilus
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pnautilus_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      - name: Run connector unit and SQLite integration tests
        env:
          DATABASE_URL: postgres://nautilus:nautilus@localhost:5432/nautilus_test
          MYSQL_URL: mysql://nautilus:nautilus@localhost:3306/nautilus_test
        run: cargo test --locked -p nautilus-orm-connector

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://nautilus:nautilus@localhost:5432/nautilus_test
        run: cargo test --locked -p nautilus-orm-connector --test integration_pg -- --ignored --test-threads=1 --nocapture

      - name: Run MySQL integration tests
        env:
          MYSQL_URL: mysql://nautilus:nautilus@localhost:3306/nautilus_test
        run: cargo test --locked -p nautilus-orm-connector --test integration_mysql -- --ignored --test-threads=1

      # Inspect effective transaction isolation through performance_schema.
      - name: Run MySQL transaction isolation tests
        env:
          MYSQL_URL: mysql://root:nautilus_root@localhost:3306/nautilus_test
        run: |
          cargo test --locked -p nautilus-orm-connector --lib --test transaction_mysql -- --ignored --test-threads=1
          cargo test --locked -p nautilus-orm-engine --test mysql_transaction_tests -- --ignored --test-threads=1
